<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Знак доступности: контраст, крупный текст и галочка">
  <title>Доступность интерфейса</title>
  <defs>
    <linearGradient id="a11y-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1e7"/>
      <stop offset="1" stop-color="#cdd8c4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#a11y-bg)"/>

  <!-- контрастный круг -->
  <circle cx="120" cy="112" r="62" fill="#262626"/>
  <path d="M120 50a62 62 0 0 1 0 124Z" fill="#ffffff"/>
  <circle cx="120" cy="112" r="62" fill="none" stroke="#6b5b3e" stroke-width="3"/>

  <!-- крупный текст -->
  <text x="120" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#262626">Aa</text>

  <!-- видимый фокус -->
  <rect x="210" y="66" width="150" height="46" rx="8" fill="#ffffff" stroke="#1c6e37" stroke-width="3"/>
  <rect x="210" y="66" width="150" height="46" rx="8" fill="none" stroke="#1c6e37" stroke-width="6" opacity="0.35"/>

  <!-- галочка -->
  <circle cx="300" cy="168" r="42" fill="#1c6e37"/>
  <path d="M280 168l14 15 27-31" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
